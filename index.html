<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Little Universe 🤍</title>

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

<div id="app">

<!-- ===========================
INTRO
=========================== -->

<section id="intro" class="page active">

<div class="glass">

<div class="logo">

🤍

</div>

<h1>

Our Little Universe

</h1>

<p>

A story that started

with a random match.

</p>

<button id="startBtn">

Begin Our Story →

</button>

</div>

</section>

<!-- ===========================
LOADING
=========================== -->

<section id="loading" class="page">

<div class="glass">

<div class="loadingEmoji">

☕

</div>

<h2>

Preparing...

</h2>

<p id="loadingText">

Brewing coffee...

</p>

<div class="loadingBar">

<div id="loadingFill"></div>

</div>

</div>

</section>

<!-- ===========================
LOCK SCREEN
=========================== -->

<section id="lockscreen" class="page">

<div class="phone">

<div id="clock">

00:00

</div>

<div id="today">

Friday

</div>

<div class="heart">

🤍

</div>

<p>

Swipe Up To Unlock

</p>

<button id="unlockBtn">

Unlock ❤️

</button>

</div>

</section>

<!-- PASSCODE -->
<section id="passcode" class="page">

<div class="glass">

<h2>

🔒 Enter Passcode

</h2>

<p>

Hint:

Favorite color

or

05/27/2026

</p>

<input

id="password"

type="text"

placeholder="Enter passcode"

autocomplete="off">

<button id="passBtn">

Unlock

</button>

<p id="hint">

</p>

</div>

</section>

</div>

<script src="script.js"></script>

</body>
</html>
